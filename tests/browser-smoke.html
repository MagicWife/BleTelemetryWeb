<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>IMU 浏览器集成测试</title>
<style>body{font:16px system-ui;background:#0a1830;color:#edf4ff;margin:20px}button{padding:10px 20px}iframe{width:100%;height:720px;border:1px solid #96aac7}pre{white-space:pre-wrap}</style>
<h1>IMU 浏览器集成测试 · 合成数据</h1>
<p>使用真实 Worker 和 v2 42 字节模拟蓝牙帧；页面数值仅用于测试，不代表真实测量。测试会覆盖预热、结果回传和断开清空。</p>
<button id="run">运行合成数据测试</button><pre id="result">尚未运行</pre><div id="preview"></div>
<script>
document.getElementById('run').onclick = () => {
  document.getElementById('run').disabled = true;
  document.getElementById('result').textContent = '测试运行中…';
  const frame = document.createElement('iframe');
  frame.src = '../index.html';
  frame.onload = () => {
    const script = frame.contentDocument.createElement('script');
    script.src = './tests/browser-driver.js';
    frame.contentDocument.body.appendChild(script);
  };
  document.getElementById('preview').replaceChildren(frame);
};
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.data?.type !== 'imu-smoke-result') return;
  document.getElementById('result').textContent = JSON.stringify(event.data.result, null, 2);
  document.getElementById('run').disabled = false;
});
</script></html>
